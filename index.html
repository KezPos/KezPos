<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Standard SEO -->
    <title>KezPos — The back office for Kenyan retail</title>
    <meta name="description" content="Sales, stock, customers and profit in one app, with KRA eTIMS and M-Pesa built in (enabled per account). Works offline and syncs when you reconnect." />
    <meta name="author" content="KezPos" />
    <link rel="canonical" href="https://kezpos.co.ke/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KezPos" />
    <meta property="og:url" content="https://kezpos.co.ke/" />
    <meta property="og:title" content="KezPos — The back office for Kenyan retail" />
    <meta property="og:description" content="Sales, stock, customers and profit in one app. Works offline and syncs when you reconnect." />
    <meta property="og:image" content="https://kezpos.co.ke/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KezPos — Run your shop like it has a back office." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KezPos — The back office for Kenyan retail" />
    <meta name="twitter:description" content="Sales, stock, customers and profit in one app. Works offline and syncs when you reconnect." />
    <meta name="twitter:image" content="https://kezpos.co.ke/og-image.jpg" />

    <!-- Icon -->
    <link rel="icon" href="%BASE_URL%kezpos.png" type="image/png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Theme -->
    <script>try{if(localStorage.getItem('kez-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
